<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Add to the shelf</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css?v=17" />
  </head>
  <body>
    <header class="sheet-head">
      <span>Add to the shelf</span>
      <button class="sheet-close" id="close" type="button" aria-label="Close">×</button>
    </header>

    <main class="sheet-body">
      <!-- READY -->
      <section class="state" data-state="ready">
        <p class="origin" id="origin"></p>

        <p class="sheet-label">What to keep</p>
        <div class="tags scope" id="scope"></div>

        <label class="sheet-label sheet-label-gap" for="passage" id="passage-label">
          What you highlighted
        </label>
        <textarea id="passage" class="passage" rows="3" spellcheck="false"></textarea>
        <p class="whole-note" id="whole-note" hidden>
          Only the title and the link are kept — the page stays where it is
          published. What you say below is what you will have of it.
        </p>

        <p class="sheet-label sheet-label-gap">Tag it</p>
        <div class="tags" id="tags"></div>

        <p class="sheet-label sheet-label-gap">Why it mattered</p>
        <div class="field">
          <textarea id="thought" class="sentence" rows="3"
                    placeholder="Write your thoughts or learnings"></textarea>
          <button id="mic" type="button" aria-label="Speak your thought" title="Speak your thought">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0" />
              <path d="M12 18v3" />
              <path d="M9 21h6" />
            </svg>
          </button>
        </div>
        <button id="mic-enable" class="speak" hidden>Enable the microphone</button>

        <div class="sheet-foot">
          <button class="shelve" id="save" type="button">Save</button>
        </div>
      </section>

      <!-- SAVING -->
      <section class="state state-centred" data-state="saving" hidden>
        <p class="meta">Saving</p>
      </section>

      <!-- SAVED -->
      <section class="state state-centred" data-state="saved" hidden>
        <p class="confirm" id="saved-line">It is on your shelf</p>
        <p class="meta" id="saved-title"></p>
        <div class="saved-actions">
          <button class="shelve" id="go-shelf" type="button">Go to shelf</button>
        </div>
      </section>

      <!-- NO SELECTION -->
      <section class="state state-centred" data-state="empty" hidden>
        <p class="confirm">Highlight something first</p>
        <p class="meta empty-hint">
          Select a passage on the page, then click the icon again
        </p>
        <button class="speak" id="save-page" type="button">Save entire web link</button>
      </section>
    </main>

    <script src="config.js?v=17"></script>
    <script src="popup.js?v=17"></script>
  </body>
</html>
